name: Publicera till combineit.se/docs

# Körs automatiskt när något som påverkar sajten mergas till main, och kan startas för hand.
# Bygger sajten för /docs, laddar upp den till en ny mapp och byter
# in den i ett steg, så att ingen besökare ser en halvfärdig sajt. Rör bara /docs.
# Första gången tar mappen över /docs från BetterDocs i WordPress (docs-internal#54).
# Backa: kör flödet "Backa publiceringen", som lägger tillbaka föregående version.
# llms.txt i WordPress rot uppdateras samtidigt, så att den följer med när sidor läggs till.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - meny.yml
      - adresser/**
      - src/**
      - public/**
      - scripts/forbered.mjs
      - scripts/mermaid.json
      - astro.config.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      bekrafta:
        description: 'Skriv PUBLICERA för att byta ut combineit.se/docs'
        required: true

permissions:
  contents: read

concurrency:
  group: publicera
  cancel-in-progress: false

jobs:
  publicera:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.bekrafta == 'PUBLICERA')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installera
        run: npm ci

      - name: Bygg
        run: npm run build

      - name: Kontrollera gamla adresser i bygget
        run: python3 adresser/kolla.py --strikt --bygge dist

      - name: Kontrollera interna länkar
        run: python3 scripts/kolla_lankar.py dist /docs

      - name: Stoppa om något sidinnehåll inte är ifyllt
        run: |
          if grep -rl "ATT FYLLA I" dist --include=index.html; then
            echo "::error::Sidorna ovan har platshållare kvar"
            exit 1
          fi

      - name: Installera lftp
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      - name: Ladda upp och byt in
        env:
          SFTP_USER: ${{ secrets.ONECOM_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.ONECOM_SFTP_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 ssh.combineit.se >> ~/.ssh/known_hosts
          lftp --env-password -u "$SFTP_USER" sftp://ssh.combineit.se <<'LFTP'
          set cmd:fail-exit yes
          cd webroots/www
          rm -rf docs-ny
          mirror --reverse --verbose=1 dist docs-ny
          set cmd:fail-exit no
          rm -rf docs-forra
          mv docs docs-forra
          set cmd:fail-exit yes
          mv docs-ny docs
          cls -la docs/ | head
          LFTP

      - name: Kontrollera att sajten svarar
        run: |
          sleep 5
          # Servern kan svara långsamt eller med 429 direkt efter uppladdningen, så varje adress får några försök
          for adress in /docs/ /docs/introduction/ /docs/web-connect-objects/; do
            for forsok in 1 2 3 4 5; do
              kod=$(curl -s -o /dev/null -m 30 -w "%{http_code}" "https://www.combineit.se$adress" || true)
              echo "$adress $kod (försök $forsok)"
              [ "$kod" = 200 ] && break
              sleep 15
            done
            [ "$kod" = 200 ] || exit 1
            sleep 2
          done

      - name: Uppdatera llms.txt i WordPress rot
        env:
          SFTP_USER: ${{ secrets.ONECOM_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.ONECOM_SFTP_PASSWORD }}
        run: |
          lftp --env-password -u "$SFTP_USER" sftp://ssh.combineit.se -e "set cmd:fail-exit yes; put dist-wordpress/llms.txt -o webroots/www/llms.txt; bye"
          sleep 2
          kod=$(curl -s -m 30 -o llms.txt -w "%{http_code}" "https://www.combineit.se/llms.txt?kontroll=$RANDOM" || true)
          echo "llms.txt $kod"
          [ "$kod" = 200 ] && grep -q '^# CombineIT' llms.txt
